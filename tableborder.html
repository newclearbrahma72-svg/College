<!DOCTYPE html>
<html>
  <head> 
    <style>
    table,tr,th,td{
      border:3px solid blue;
      border-left-color:red;
      border-right-color:green;
      border-right-style:dashed;
      border-bottom-style:dotted;}
      table{
        width:40%;
        text-align:left;
        background-color:yellow;}
  </style>
  </head>
  <body><h1> Example of Table border with color </h1> 
  <table>
    <tr><th>FirstName</th><th>LastName</th><th>Saving</th></tr>
    <tr><td>Amit</td><td>Tiwari</td><td>$5000</td></tr>
    <tr><td>Paeiohary</td><td>Tiwari</td><td>$10000</td></tr>
    <tr><td>Ashish</td><td>Shukla</td><td>$15000</td></tr>
  </table></body>
</html>
